# ==============================================================================
# HOME ASSISTANT - Automation: Frigate Motion → NTFY Push Notification
# ==============================================================================
# File location: /opt/homelab/homeassistant/automations.yaml
#
# This file is automatically loaded by Home Assistant if you add:
#   automation: !include automations.yaml
# to your /opt/homelab/homeassistant/configuration.yaml
#
# How it works:
#   1. Frigate publishes motion events to MQTT at: frigate/events
#   2. Home Assistant listens for NEW events (type=new) on that topic
#   3. When triggered, sends a push notification via NTFY to your phone
#
# Prerequisites:
#   - Frigate integration installed in Home Assistant (HACS or built-in)
#   - MQTT integration configured (see: Settings → Integrations → MQTT)
#   - NTFY app installed on family phones, subscribed to "home-alerts" topic
# ==============================================================================

# -----------------------------------------------------------------------
# Automation 1: Any Camera Detects Motion → NTFY push alert
# -----------------------------------------------------------------------
- id: "frigate_motion_ntfy_alert"
  alias: "Camera Motion Alert via NTFY"
  description: >
    When Frigate detects motion on any camera, send a push notification
    to the NTFY home-alerts topic so all family phones are alerted.
  trigger:
    - platform: mqtt
      topic: "frigate/events"
      payload: "new"
      value_template: "{{ value_json['type'] }}"
  condition:
    # Only alert between 8pm and 7am (night-time security focus)
    # Remove or adjust this condition to get 24/7 alerts
    - condition: time
      after: "20:00:00"
      before: "07:00:00"
  action:
    - service: rest_command.ntfy_alert
      data:
        title: "🚨 Motion Detected"
        message: >-
          Camera {{ trigger.payload_json['after']['camera'] | replace('_', ' ') | title }}
          detected motion at {{ now().strftime('%I:%M %p') }}.
        tags: "camera,motion"
        priority: "3"

