# ==============================================================================
# HOME LAB SYSTEM - Camera Stack (Frigate NVR)
# ==============================================================================
# Architecture:
#   Frigate NVR processes RTSP streams from the analog cameras via the DVR
#   (IP: 192.168.1.2) using Intel VAAPI hardware decoding on the i3 GPU.
#   All recordings are stored locally under /opt/homelab/recordings/.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Frigate - NVR & Motion Detection
  # ----------------------------------------------------------------------------
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.13.2
    container_name: hl_frigate
    privileged: true
    restart: unless-stopped
    shm_size: "128mb"  # Required shared memory for 4 camera streams
    devices:
      - /dev/dri:/dev/dri  # Maps Intel HD GPU for hardware accelerated decoding
    ports:
      - "5000:5000"        # Web UI
      - "8554:8554"        # RTSP re-streaming
      - "8555:8555/tcp"    # WebRTC TCP
      - "8555:8555/udp"    # WebRTC UDP
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      FRIGATE_RTSP_USER: ${CAMERA_USER}
      FRIGATE_RTSP_PASSWORD: ${CAMERA_PASS}
      DVR_IP: ${DVR_IP}
      FRIGATE_MQTT_USER: ${MQTT_USER:-}
      FRIGATE_MQTT_PASSWORD: ${MQTT_PASS:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /opt/homelab/config/frigate:/config
      - /opt/homelab/recordings:/media/frigate
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - homelab_net
