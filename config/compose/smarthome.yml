# ==============================================================================
# HOME LAB SYSTEM - Smart Home Stack
# Home Assistant + Mosquitto MQTT Broker
# ==============================================================================
# Architecture:
#   Mosquitto (MQTT Broker) ← Frigate (motion events) + future IoT devices
#         ↓
#   Home Assistant (receives MQTT events, triggers automations)
#         ↓
#   NTFY (push notifications to phones via automation)
#
# Home Assistant Web UI:  http://homeassistant.home  (port 8123 → NPM)
# Mosquitto MQTT:         mqtt://hl_mosquitto:1883   (internal Docker only)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Mosquitto - MQTT Broker
  # Acts as the message bus between Frigate (camera events) and Home Assistant.
  # NOT exposed externally — only reachable on internal homelab_net.
  # Credentials are mounted from mosquitto/passwd (generated by setup.sh).
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: hl_mosquitto
    restart: unless-stopped
    volumes:
      - /opt/homelab/config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /opt/homelab/config/mosquitto/passwd:/mosquitto/config/passwd:ro
      - /opt/homelab/config/mosquitto/data:/mosquitto/data
      - /opt/homelab/config/mosquitto/log:/mosquitto/log
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -u ${MQTT_USER} -P ${MQTT_PASS} -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Home Assistant - Smart Home Automation Hub
  # Integrates with: Frigate (via MQTT + Frigate integration), NTFY (webhook)
  # Uses host network mode for auto-discovery of local devices (mDNS/DLNA).
  # Config is stored at /opt/homelab/homeassistant/ for easy editing.
  # ----------------------------------------------------------------------------
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2024.7.3
    container_name: hl_homeassistant
    restart: unless-stopped
    privileged: true              # Required for USB/Bluetooth device access
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - /opt/homelab/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8123:8123"               # Home Assistant Web UI
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
