

# ==============================================================================
# HOME LAB SYSTEM - Foundation Stack (Portainer & Nginx Proxy Manager)
# ==============================================================================

services:
  # Portainer CE - Container Management Web UI
  portainer:
    image: portainer/portainer-ce:2.21.3
    container_name: hl_portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/homelab/config/portainer_data:/data
    healthcheck:
      # Since Portainer runs in a scratch image, we check version output
      # to ensure the binary is healthy and responsive.
      test: ["CMD", "/portainer", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - homelab_net

  # Nginx Proxy Manager - Reverse Proxy
  nginx_proxy_manager:
    image: jc21/nginx-proxy-manager:2.11.2
    container_name: hl_nginx_proxy_manager
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP traffic
      - "81:81"     # Web Admin UI
      - "443:443"   # HTTPS traffic
    volumes:
      - /opt/homelab/config/nginx_proxy_manager/data:/data
      - /opt/homelab/config/nginx_proxy_manager/letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - homelab_net

networks:
  homelab_net:
    name: homelab_net
    driver: bridge
