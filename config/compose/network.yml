
# ==============================================================================
# HOME LAB SYSTEM - Network Stack
# Pi-hole + Unbound (DNS + Ad Blocking) + NTFY (Push Notifications)
# ==============================================================================
# Architecture:
#   [Network Devices] → Pi-hole (port 53) → Unbound (port 5335, internal only)
#                                                  ↓
#                                    Root DNS Servers (recursive)
#
# Pi-hole admin UI runs on port 8080 to avoid conflict with Nginx Proxy Manager
# Unbound is NOT exposed to the host — Pi-hole talks to it via internal Docker net
# NTFY runs on port 2586
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Unbound - Recursive DNS Resolver
  # Resolves queries by querying root nameservers directly (no Google/Cloudflare)
  # Listens internally on port 5335 - NOT exposed to the host network
  # ----------------------------------------------------------------------------
  unbound:
    image: klutchell/unbound:1.21.1
    container_name: hl_unbound
    restart: unless-stopped
    volumes:
      - /opt/homelab/config/unbound/pi-hole.conf:/etc/unbound/custom.conf.d/pi-hole.conf:ro
    networks:
      - homelab_net
    healthcheck:
      test:
        - CMD
        - drill
        - -p
        - "5335"
        - google.com
        - "@127.0.0.1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Pi-hole - Network-Wide DNS & Ad Blocker
  # Listens on port 53 (DNS) and 8080 (Admin UI)
  # Forwards all DNS queries upstream to Unbound at unbound:5335 (internal)
  # Local DNS records in custom.list resolve *.home domains for all devices
  # ----------------------------------------------------------------------------
  pihole:
    image: pihole/pihole:2024.07.0
    container_name: hl_pihole
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    ports:
      - "53:53/tcp"        # DNS TCP
      - "53:53/udp"        # DNS UDP
      - "8080:80/tcp"      # Pi-hole admin UI (avoids conflict with NPM on port 80)
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      WEBPASSWORD: ${PIHOLE_WEBPASSWORD}
      # Point Pi-hole upstream to Unbound via internal Docker network
      DNS1: "unbound#5335"
      DNS2: "no"           # Use ONLY Unbound — no fallback to external DNS
      DNSSEC: "false"      # Unbound handles DNSSEC validation instead
      INTERFACE: "eth0"
      DNSMASQ_LISTENING: "all"
      # Conditional forwarding: resolve local device hostnames from router
      REV_SERVER: "true"
      REV_SERVER_DOMAIN: "local"
      REV_SERVER_TARGET: "${ROUTER_IP}"
      REV_SERVER_CIDR: "${LAN_SUBNET}"
    volumes:
      - /opt/homelab/config/pihole/etc-pihole:/etc/pihole
      - /opt/homelab/config/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
      # Custom local DNS records - all *.home domains point to this server
      - /opt/homelab/config/pihole/custom.list:/etc/pihole/custom.list:ro
    healthcheck:
      test:
        - CMD
        - dig
        - +short
        - +timeout=5
        - "pi.hole"
        - "@127.0.0.1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - homelab_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # NTFY - Self-Hosted Push Notification Server
  # Sends push alerts to all family phones via the NTFY app
  # Channels: home-alerts, cameras, reminders
  # ----------------------------------------------------------------------------
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: hl_ntfy
    restart: unless-stopped
    command: serve
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "2586:80"          # NTFY web UI and push endpoint
    volumes:
      - /opt/homelab/config/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - /opt/homelab/config/ntfy/data:/var/lib/ntfy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - homelab_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
