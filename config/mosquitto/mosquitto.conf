# ==============================================================================
# HOME LAB SYSTEM - Mosquitto MQTT Broker Configuration
# ==============================================================================
# Security:
#   - Anonymous access DISABLED — all clients must authenticate with user/pass
#   - Password file is generated during setup (see setup.sh)
#   - Mosquitto is NOT port-exposed externally (Docker internal network only)
# ==============================================================================

# --- Listener ---
listener 1883
protocol mqtt

# --- Authentication (required) ---
# Password file is created by setup.sh using mosquitto_passwd
# Format: username:hashed_password
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Persistence ---
# Retains messages and subscriptions across restarts
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
