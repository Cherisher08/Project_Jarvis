

# ==============================================================================
# HOME LAB SYSTEM - Master Docker Compose Configuration
# ==============================================================================
# This configuration leverages the Docker Compose 'include' directive to load
# individual, modular service configurations. This keeps configurations clean
# and allows starting/stopping modules independently.
# ==============================================================================

# Core infrastructure and reverse proxy (Phase 1 & 2)
include:
  - compose/foundation.yml

  # Uncomment subsequent modules as they are developed and deployed:
  - compose/network.yml         # Pi-hole, Unbound, NTFY
  - compose/cameras.yml         # Frigate NVR
  - compose/smarthome.yml     # Home Assistant, Mosquitto MQTT
  # - compose/photos.yml        # Immich Stack (Redis, Postgres, ML, Server)
  # - compose/media.yml         # Jellyfin, Calibre-Web
