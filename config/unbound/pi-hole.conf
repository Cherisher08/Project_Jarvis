server:
    # =========================================================================
    # HOME LAB - Unbound Recursive DNS Resolver Configuration
    # Based on the official Pi-hole documentation recommendation:
    # https://docs.pi-hole.net/guides/dns/unbound/
    # =========================================================================

    # Logging: set verbosity to 0 for quiet operation (increase to 1 for debug)
    verbosity: 0

    # Listen on all interfaces on port 5335 (internal Docker network)
    # Pi-hole contacts Unbound at unbound:5335 via the homelab_net bridge network
    interface: 0.0.0.0
    port: 5335

    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # Disable IPv6 (not needed in this home lab)
    do-ip6: no
    prefer-ip6: no

    # Trust glue records only when they are within the server's authority
    harden-glue: yes

    # Require DNSSEC data for trust-anchored zones
    # Zones that fail DNSSEC validation are marked BOGUS
    harden-dnssec-stripped: yes

    # Disable query name minimisation (causes issues with some DNSSEC zones)
    qname-minimisation: no

    # Do not use Capitalization randomization (known to cause DNSSEC issues)
    use-caps-for-id: no

    # Reduce EDNS reassembly buffer size to avoid IP fragmentation issues
    edns-buffer-size: 1472

    # Prefetch DNS records that are close to expiry for faster subsequent lookups
    prefetch: yes

    # Single thread is sufficient for a home lab environment
    num-threads: 1

    # Large enough kernel buffer to avoid dropping queries during traffic spikes
    so-rcvbuf: 1m

    # Allow queries from the Docker bridge network range (Pi-hole's network)
    # Also allow local loopback for health checks
    access-control: 0.0.0.0/0 allow

    # Hide server identity and version from external queries (security)
    hide-identity: yes
    hide-version: yes
