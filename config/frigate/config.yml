# ==============================================================================
# HOME LAB SYSTEM - Frigate NVR Configuration
# ==============================================================================

# MQTT Configuration (Used for Home Assistant integration in Phase 4)
# Connected to the Mosquitto MQTT broker in the same homelab_net network
mqtt:
  host: hl_mosquitto
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

# Define CPU detector explicitly to avoid errors regarding missing Coral TPU
detectors:
  cpu:
    type: cpu

# Enable Intel VAAPI Hardware Acceleration globally for Intel HD 4400/4600 GPU
ffmpeg:
  hwaccel_args: preset-vaapi

# go2rtc Configuration: restreaming engine to reduce DVR connection overhead
# and enable native browser decoding (WebRTC/MSE) with correct coloring.
go2rtc:
  streams:
    # Camera 1 Streams
    camera_1:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_IP}:554/Streaming/Channels/102#transport=tcp
    camera_1_record:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_IP}:554/Streaming/Channels/101#transport=tcp

    # Camera 2 Streams
    camera_2:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_IP}:554/Streaming/Channels/202#transport=tcp
    camera_2_record:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_IP}:554/Streaming/Channels/201#transport=tcp

    # Camera 3 Streams
    camera_3:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_IP}:554/Streaming/Channels/302#transport=tcp
    camera_3_record:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_IP}:554/Streaming/Channels/301#transport=tcp

    # Camera 4 Streams
    camera_4:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_IP}:554/Streaming/Channels/402#transport=tcp
    camera_4_record:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_IP}:554/Streaming/Channels/401#transport=tcp

# Global Defaults for Camera Streams
detect:
  enabled: false  # Object detection DISABLED — saves CPU/RAM on 4GB i3 system

# Motion detection: lightweight pixel-comparison (no AI). Publishes events
# to MQTT at frigate/events so Home Assistant can trigger NTFY alerts.
motion:
  threshold: 30         # Sensitivity: 0 (most sensitive) - 255 (least sensitive)
  contour_area: 10      # Min pixel area change to register as motion
  frame_alpha: 0.01
  frame_height: 100

record:
  enabled: true
  retain:
    days: 7       # Keep continuous 24/7 recordings for 7 days
    mode: all
  events:
    retain:
      default: 30 # Keep motion-triggered event clips for 30 days
      mode: motion

# Camera Definitions (consuming local go2rtc streams)
cameras:
  # ----------------------------------------------------------------------------
  # Camera 1 (DVR Channel 1)
  # ----------------------------------------------------------------------------
  camera_1:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_1_record
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_1
          roles:
            - detect

  # ----------------------------------------------------------------------------
  # Camera 2 (DVR Channel 2)
  # ----------------------------------------------------------------------------
  camera_2:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_2_record
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_2
          roles:
            - detect

  # ----------------------------------------------------------------------------
  # Camera 3 (DVR Channel 3)
  # ----------------------------------------------------------------------------
  camera_3:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_3_record
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_3
          roles:
            - detect

  # ----------------------------------------------------------------------------
  # Camera 4 (DVR Channel 4)
  # ----------------------------------------------------------------------------
  camera_4:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_4_record
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_4
          roles:
            - detect
