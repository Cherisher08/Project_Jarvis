# ==============================================================================
# HOME LAB SYSTEM - Frigate NVR Configuration
# ==============================================================================

# MQTT: Disabled until Mosquitto (Phase 4) is deployed.
# Re-enable by removing 'enabled: false' after running smarthome stack.
mqtt:
  enabled: false

# Define CPU detector explicitly to avoid errors regarding missing Coral TPU
detectors:
  cpu:
    type: cpu

# FFmpeg global settings
# NOTE: Hardware acceleration (preset-vaapi) is temporarily disabled.
# It can cause color corruption when DVR stream quality is marginal.
# Re-enable once streaming is confirmed stable.
ffmpeg:
  input_args: preset-rtsp-restream

# go2rtc Configuration: single connection per camera to the DVR.
# Frigate consumes go2rtc's local RTSP relay instead of hitting the DVR directly.
# This prevents "too many connections" errors on the DVR.
#
# TCP transport is forced via rtsp.default_query (go2rtc native config).
# Do NOT use #transport=tcp in stream URLs — that is ffmpeg syntax and
# go2rtc will misinterpret it as a second stream source named "tcp".
go2rtc:
  log:
    level: "debug"
  rtsp:
    default_query: "transport=tcp"   # Force TCP for all DVR connections
  streams:
    camera_1:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_IP}:554/Streaming/Channels/101
    camera_2:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_IP}:554/Streaming/Channels/201
    camera_3:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_IP}:554/Streaming/Channels/301
    camera_4:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_IP}:554/Streaming/Channels/401

# Object detection DISABLED — saves CPU/RAM on 4GB i3 system
detect:
  enabled: false

# Motion detection: lightweight pixel-comparison (no AI)
motion:
  threshold: 30
  contour_area: 10
  frame_alpha: 0.01
  frame_height: 100

record:
  enabled: true
  retain:
    days: 7
    mode: all
  events:
    retain:
      default: 30
      mode: motion

# Camera Definitions: all cameras consume their go2rtc local stream.
# Single input with both 'record' and 'detect' roles — one connection each.
cameras:
  camera_1:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_1
          roles:
            - record
            - detect

  camera_2:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_2
          roles:
            - record
            - detect

  camera_3:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_3
          roles:
            - record
            - detect

  camera_4:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_4
          roles:
            - record
            - detect
