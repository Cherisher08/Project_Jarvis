services:
  # ----------------------------------------------------------------------------
  # Immich Core Server (Lean Profile - Machine Learning Container Omitted)
  # Features: Mobile auto-backup (iOS/Android), albums, timeline, multi-user
  # ----------------------------------------------------------------------------
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    container_name: hl_immich_server
    restart: unless-stopped
    ports:
      - "${IMMICH_PORT:-2283}:2283/tcp"
    environment:
      TZ: ${TZ:-Etc/UTC}
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: ${IMMICH_DB_USER:-postgres}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:-ChangeMeImmichDbSecret!}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME:-immich}
      REDIS_HOSTNAME: immich_redis
    volumes:
      - ${MEDIA_ROOT:-/opt/homelab/media}/photos:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy
    networks:
      - homelab_net
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Immich Redis: High-performance caching & queue broker
  # ----------------------------------------------------------------------------
  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    container_name: hl_immich_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homelab_net
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ----------------------------------------------------------------------------
  # Immich Database: Vector-enabled PostgreSQL (VectorChord)
  # ----------------------------------------------------------------------------
  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: hl_immich_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:-ChangeMeImmichDbSecret!}
      POSTGRES_USER: ${IMMICH_DB_USER:-postgres}
      POSTGRES_DB: ${IMMICH_DB_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DATA_ROOT:-/opt/homelab/data}/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homelab_net
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  homelab_net:
    name: homelab_net
    external: true
